name: Verify research delivery

on:
  pull_request:
  push:
    branches: [main, arena/de338d32-57gemsdoe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - name: Shared metric, holdout, geometry, packaging and gate regressions
        run: python -m pytest
      - name: Static links, actual TIFF/ZIP bytes and current negative card
        run: python scripts/check_site.py --build
